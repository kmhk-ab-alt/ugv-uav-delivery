<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROUND / AIR — Cooperative Delivery</title><style>
*{box-sizing:border-box}body{margin:0;background:#b3c5c9;color:#f6faf9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#09151c99,transparent 26%,transparent 76%,#09151c99)}
header{position:absolute;top:24px;right:24px}.stats{display:flex;gap:20px;text-align:right}.number{font-size:28px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.3}.caption{font-size:10px;color:#ccdbdc}#scorebox{display:none}
#explain{position:absolute;left:24px;top:24px;width:260px;max-height:calc(100vh - 48px);overflow:auto;pointer-events:auto}.explain-card{background:#0b1b27ed;border:1px solid #9ac8d44d;border-radius:10px;padding:14px}.step{font-size:14px;font-weight:600;letter-spacing:.05em;color:#ecf6f7}#explain h2{font-size:12px;font-weight:500;color:#bacfd5;margin:7px 0}#explain p{font-size:11px;line-height:1.5;margin:7px 0}.camera-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.camera-grid img{width:100%;height:72px;object-fit:contain;background:#20303a;border-radius:5px}.camera-grid strong{display:block;font-size:12px}.camera-grid small{display:block;font-size:10px;color:#c2d7dd;line-height:1.5}.available{color:#8be6bb}.blocked{color:#ffb08c}
#agent-panel{position:absolute;right:24px;top:110px;width:280px;max-height:calc(100vh - 200px);overflow:auto;pointer-events:auto;background:#0b1b27df;border:1px solid #9ac8d435;border-radius:10px;padding:16px}#agent-panel h2{font-size:14px;margin:0 0 12px}#log-status{font-size:11px;color:#ffdba1;margin:0}#log-status:empty{display:none}.agent-entry+.agent-entry{border-top:1px solid #ffffff24;margin-top:16px;padding-top:14px}.agent-entry h3{font-size:13px;margin:0}.agent-entry h3.ground{color:#91e3ed}.agent-entry h3.uav{color:#ffbd9d}.agent-current{font-size:12px;margin:6px 0 10px;color:#fff}.agent-entry ol{list-style:none;padding:0;margin:0}.agent-entry li{font-size:11px;line-height:1.65;color:#ccdcdf;margin:6px 0;display:grid;grid-template-columns:35px 1fr;gap:5px}.agent-entry time{font-variant-numeric:tabular-nums;color:#87a9b3;font-size:10px}
.controls{position:absolute;right:24px;bottom:24px;display:flex;gap:7px;pointer-events:auto}button{border:1px solid #c4e1e255;background:#142833c9;color:#e6f3f2;border-radius:7px;padding:9px 12px;cursor:pointer;font-family:inherit;font-size:11px}button.on{background:#2b6d73;border-color:#8be1d4}#error{position:fixed;inset:30%;display:none;background:#182b35f2;padding:25px;border-radius:10px;z-index:10;font-size:14px;line-height:1.8}
@media(max-width:850px){#explain{left:14px;top:18px;width:190px}#agent-panel{right:14px;width:205px;top:95px;padding:12px}header{right:14px;top:18px}.stats{gap:12px}.number{font-size:23px}.camera-grid{gap:8px}.camera-grid img{height:52px}.camera-grid strong{font-size:11px}#explain .explain-card{padding:12px}.controls{right:14px;bottom:18px;gap:5px}button{padding:8px;font-size:10px}}
</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body>
<div id="ui"><header><div class="stats"><div id="scorebox"><div class="number" id="score">0 pt</div><div class="caption">配送得点</div></div><div><div class="number" id="delivered">0 / 0</div><div class="caption">DELIVERED</div></div><div><div class="number" id="clock">00:00</div><div class="caption" id="clocklabel">経過時間</div></div></div></header><section id="explain" aria-label="モデルの入出力">
<div class="explain-card"><div class="step">環境状況</div><h2 id="vision-label">画像認識・接続待ち</h2><p id="vision-status">画像から進入路の通行可否を確認</p><div class="camera-grid"><div><img id="image-pickup_A" alt="集荷 Aの認識入力画像" hidden><strong id="label-pickup_A">集荷 A</strong><small id="reason-pickup_A">画像待ち</small></div><div><img id="image-pickup_B" alt="集荷 Bの認識入力画像" hidden><strong id="label-pickup_B">集荷 B</strong><small id="reason-pickup_B">画像待ち</small></div><div><img id="image-meeting_A" alt="合流 Aの認識入力画像" hidden><strong id="label-meeting_A">合流 A</strong><small id="reason-meeting_A">画像待ち</small></div><div><img id="image-meeting_B" alt="合流 Bの認識入力画像" hidden><strong id="label-meeting_B">合流 B</strong><small id="reason-meeting_B">画像待ち</small></div></div></div>
</section><section id="agent-panel" aria-label="機体ごとの判断ログ"><h2>判断ログ</h2><p id="log-status" role="status"></p><div id="agent-log">接続待ち</div></section><div class="controls"><button class="on" data-camera="auto">自動カメラ</button><button data-camera="overview">全景</button><button data-camera="handoff">受け渡し</button><button data-camera="vehicle">機体</button></div></div><div id="error"></div><script type="module" src="/viewer.js"></script></body></html>
